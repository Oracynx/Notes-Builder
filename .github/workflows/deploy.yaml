name: Build and Deploy Quartz Site

on:
  repository_dispatch:
    types: [build-site]   # 接收来自 Notes 仓库的触发事件

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quartz
        uses: actions/checkout@v3

      - name: Checkout Vault
        uses: actions/checkout@v3
        with:
          repository: Oracynx/Notes
          path: vault
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Sync Notes
        run: rsync -av --exclude='.git' vault/ ./content/

      - name: Inject title from first heading
        run: |
          #!/usr/bin/env bash
          find ./content -type f -name "*.md" | while read -r file; do
            echo "DEBUG: processing file=$file"

            # 找到第一个 Markdown 标题行
            first_line=$(grep -m1 -E '^#{1,6}[[:space:]]*.+$' "$file")
            echo "DEBUG: first_line='$first_line'"

            # 提取标题文本
            title=$(echo "$first_line" | sed -E 's/^#{1,6}[[:space:]]*//')
            echo "DEBUG: extracted title='$title'"

            if [ -n "$title" ]; then
              if grep -q '^---' "$file"; then
                if grep -q '^title:' "$file"; then
                  echo "DEBUG: replacing existing title in $file"
                  sed -i "s/^title:.*/title: ${title}/" "$file"
                else
                  echo "DEBUG: inserting title into existing frontmatter in $file"
                  sed -i "1,/^---$/ {/^---$/i title: ${title}}" "$file"
                fi
              else
                echo "DEBUG: adding new frontmatter with title to $file"
                sed -i "1i ---\ntitle: ${title}\n---" "$file"
              fi
            else
              echo "DEBUG: no title extracted for $file"
            fi
          done


      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          check-latest: true

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build Quartz
        run: npx quartz build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
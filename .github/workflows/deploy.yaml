name: Build and Deploy Quartz Site

on:
  repository_dispatch:
    types: [build-site]   # 接收来自 Notes 仓库的触发事件

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quartz
        uses: actions/checkout@v3

      - name: Checkout Vault
        uses: actions/checkout@v3
        with:
          repository: Oracynx/Notes
          path: vault
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Sync Notes
        run: rsync -av --exclude='.git' vault/ ./content/

      - name: Inject title from first heading
        run: |
          for file in ./content/**/*.md; do
            # 找到第一个非空行
            first_line=$(grep -m1 -E '^[^[:space:]]' "$file")
            if [[ $first_line =~ ^\#\ (.*) ]]; then
              title="${BASH_REMATCH[1]}"
              # 检查是否已有 frontmatter
              if grep -q '^---' "$file"; then
                # 如果已有 frontmatter，插入或替换 title 字段
                if grep -q '^title:' "$file"; then
                  sed -i "s/^title:.*/title: ${title}/" "$file"
                else
                  sed -i "1,/^---$/ s/^---$/title: ${title}\n---/" "$file"
                fi
              else
                # 没有 frontmatter则在文件开头插入
                sed -i "1i ---\ntitle: ${title}\n---" "$file"
              fi
            fi
          done


      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          check-latest: true

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build Quartz
        run: npx quartz build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public